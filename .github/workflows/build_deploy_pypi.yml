name: (cloud) Build and Deploy PyPI

on:
    # creates a button
    workflow_dispatch:
        inputs:
            logLevel:
                description: "Log level"
                required: true
                default: "warning"
                type: choice
                options:
                    - info
                    - warning
                    - debug

jobs:
    build_and_deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - name: Install uv
              uses: astral-sh/setup-uv@v5
            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.10'
            - name: Install Dependencies
              run: |
                uv sync --extra all
            - name: Build package
              run: |
                uv build
            - name: Publish distribution 📦 to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                password: ${{ secrets.PYPI_TOKEN }}
