name: Nightly Coverage

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pytest coverage
        run: |
          uv run --extra all python -m pytest tests \
            --cov=src/rescale4dl \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.RESCALE4DL_CODECOV }}
          files: ./coverage.xml
          fail_ci_if_error: true

  pypi_clean_install_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create isolated venv and install from PyPI
        run: |
          uv venv .venv-pypi --python 3.11
          uv pip install --python .venv-pypi/bin/python "rescale4dl[all]" pytest pytest-cov pytest-xdist nbmake

      - name: Run tests against PyPI package
        run: |
          .venv-pypi/bin/python -m pytest tests
